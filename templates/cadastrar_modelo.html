{% extends 'base.html' %}
{% block title%}Cadastrar Aparelho{% endblock %} 
{% block content %}
<h2>Cdastrar Aparelho de ar condicionado</h2>

<form method="POST">
    
    <label for="fabricante">Fabricante</label><br>
    <input type="text" name="fabricante" required><br><br>

    <label for="nome_marca">Nome/Marca:</label><br>
    <input type="text" name="nome_marca" required><br><br>



    <label for="capacidade_btu">Capacidade (BTU)</label><br>
    <input type="text" name="capacidade_btu" required><br><br>

    <button type="submit">Cadastrar</button>
    
</form>
{% endblock %}
